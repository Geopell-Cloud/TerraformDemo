name: "Terraform Demo"

on:
  workflow_dispatch:
    inputs:
      custom_command:
        description: 'Run Terraform Custom Command - (terraform force-unlock -force <lock id>)'
        required: true  

permissions:
  id-token: write
  contents: read     

jobs:
  terraform:
    name: "Terraform Custom Run"
    runs-on: ubuntu-latest
    environment: dev

    env:
      ARM_USE_OIDC: "true"  # uses OIDC instead of client secret
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      TF_VAR_azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      TF_VAR_azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    #    TF_LOG: DEBUG  

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v4
 
      - name: Initialize Terraform
        run: terraform init

      - name: Terraform Custom Command
        run: ${{ github.event.inputs.custom_command }}
